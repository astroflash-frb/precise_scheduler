[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "precise-scheduler"
version = "0.4.0"
description = "Automated observation scheduler for the PRECISE VLBI FRB monitoring campaign"
requires-python = ">=3.11"
dependencies = [
    "setuptools",
    "rich-argparse>=1.4",
    "rich>=13",
    "gspread>=6",
    "google-auth>=2",
    "slack-sdk>=3.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",          # async HTTP client for Mattermost webhook
    "tomli-w>=1.0",         # TOML writer (tomllib in stdlib reads only)
    "astropy>=6",           # timedelta, Time utilities
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",          # mock httpx calls
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
precise = "precise_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["precise_scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that hit real external services (deselect with -m 'not integration')",
]
asyncio_mode = "auto"
