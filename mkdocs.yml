site_name: PRECISE Scheduler
site_description: Automated observation scheduler for the PRECISE VLBI FRB monitoring campaign
repo_url: https://github.com/jive-vlbi/precise-scheduler
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage:
    - CLI Reference: usage/cli-commands.md
    - Examples: usage/examples.md
  - Reference:
    - Activity Database: reference/activity-database.md
    - Configuration: reference/configuration.md

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tasklist
  - admonition
  - toc:
      permalink: true
